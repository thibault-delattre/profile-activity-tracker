<svg xmlns="http://www.w3.org/2000/svg" width="900" height="419" viewBox="0 0 900 419" role="img" aria-labelledby="title desc">
  <title id="title">GitHub activity for @thibault-delattre</title>
  <desc id="desc">GitHub activity for my current account This profile card reflects public contributions and active days for the configured GitHub account. 0 contributions this week, 0 this month, 0 this year, 0 total.</desc>
  <defs>
    <clipPath id="glass-clip">
      <rect x="16" y="101" width="868" height="210" rx="12"/>
    </clipPath>
    <linearGradient id="animated-border" x1="16" y1="101" x2="884" y2="311" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="25%" stop-color="#f7fbff"/>
      <stop offset="50%" stop-color="#ff7b72"/>
      <stop offset="75%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#58a6ff"/>
      <animateTransform
        attributeName="gradientTransform"
        type="rotate"
        from="0 450 206"
        to="360 450 206"
        dur="6s"
        repeatCount="indefinite"
      />
    </linearGradient>
    <linearGradient id="glass-fill" x1="0" y1="101" x2="0" y2="311" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#263140" stop-opacity="0.78"/>
      <stop offset="48%" stop-color="#111820" stop-opacity="0.66"/>
      <stop offset="100%" stop-color="#263140" stop-opacity="0.74"/>
    </linearGradient>
    <radialGradient id="ambient-blue" cx="0%" cy="0%" r="105%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.13"/>
      <stop offset="48%" stop-color="#58a6ff" stop-opacity="0.035"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient-red" cx="100%" cy="100%" r="110%">
      <stop offset="0%" stop-color="#ff7b72" stop-opacity="0.09"/>
      <stop offset="52%" stop-color="#ff7b72" stop-opacity="0.025"/>
      <stop offset="100%" stop-color="#ff7b72" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass-highlight" x1="40" y1="105" x2="804" y2="201" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="period-fill" x1="184" y1="161" x2="856" y2="193" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.84"/>
      <stop offset="50%" stop-color="#161b22" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.76"/>
    </linearGradient>
    <filter id="panel-shadow" x="-12%" y="-32%" width="124%" height="174%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.15"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="activity-title-shadow" x="-8%" y="-45%" width="116%" height="190%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .introduction { font-size: 22px; font-weight: 600; }
    .about { font-weight: 400; }
    .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 1.4px; }
    .period { font-size: 10px; font-weight: 700; letter-spacing: 1.1px; }
    .row-label { font-size: 11px; font-weight: 700; letter-spacing: 1px; }
    .value { font-size: 29px; font-weight: 650; }
    .language { font-size: 12px; font-weight: 600; }
    .reveal {
      opacity: 0;
      animation: fade-in 950ms cubic-bezier(0.4, 0, 0.2, 1) both;
      will-change: opacity;
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; animation: none; }
    }
  </style>
  <rect width="900" height="419" fill="#0d1117"/>
  <text x="32" y="38" class="introduction reveal" style="animation-delay:0ms" fill="#f0f6fc">GitHub activity for my current account</text>
  <text x="32" y="65" class="about" fill="#8b949e"><tspan x="32" dy="0" class="reveal" style="animation-delay:90ms" font-size="14px" word-spacing="0px">This profile card reflects public contributions and active days for the configured GitHub account.</tspan></text>

  <g class="glass-panel">
    <g class="reveal" style="animation-delay:320ms">
      <rect x="16" y="101" width="868" height="210" rx="12" fill="#111820" opacity="0.74" filter="url(#panel-shadow)"/>
      <rect x="16" y="101" width="868" height="210" rx="12" fill="url(#glass-fill)"/>
      <g clip-path="url(#glass-clip)" pointer-events="none">
        <rect x="16" y="101" width="868" height="210" fill="url(#ambient-blue)"/>
        <rect x="16" y="101" width="868" height="210" fill="url(#ambient-red)"/>
      </g>
      <rect x="19" y="104" width="862" height="204" rx="9" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
      <path d="M 40 102.5 H 764" stroke="url(#glass-highlight)" stroke-width="1.5" stroke-linecap="round"/>
      <rect x="17.25" y="102.25" width="865.5" height="207.5" rx="11" fill="none" stroke="url(#animated-border)" stroke-width="2.5"/>
    </g>
    <g class="reveal" style="animation-delay:450ms">
      <text x="44" y="134" class="eyebrow" fill="#ffffff" filter="url(#activity-title-shadow)">GITHUB ACTIVITY</text>
      <line x1="44" y1="149" x2="856" y2="149" stroke="#30363d" stroke-opacity="0.82"/>
    </g>
    <g class="reveal" style="animation-delay:540ms">
      <rect x="184" y="161" width="672" height="32" rx="6" fill="url(#period-fill)" stroke="#ffffff" stroke-opacity="0.09"/>
      <text x="275" y="181" text-anchor="middle" class="period" fill="#8b949e">THIS WEEK</text><text x="435" y="181" text-anchor="middle" class="period" fill="#8b949e">THIS MONTH</text><text x="595" y="181" text-anchor="middle" class="period" fill="#8b949e">THIS YEAR</text><text x="760" y="181" text-anchor="middle" class="period" fill="#8b949e">ALL TIME</text>
    </g>
    <g class="reveal" style="animation-delay:630ms">
      <text x="44" y="219" class="row-label" fill="#8b949e">CONTRIBUTIONS</text>
      <text x="275" y="224" text-anchor="middle" class="value" fill="#f0f6fc">0</text><text x="435" y="224" text-anchor="middle" class="value" fill="#f0f6fc">0</text><text x="595" y="224" text-anchor="middle" class="value" fill="#f0f6fc">0</text><text x="760" y="224" text-anchor="middle" class="value" fill="#f0f6fc">0</text>
    </g>
    <g class="reveal" style="animation-delay:720ms">
      <line x1="184" y1="239" x2="856" y2="239" stroke="#30363d" stroke-opacity="0.84"/>
      <text x="44" y="272" class="row-label" fill="#8b949e">ACTIVE DAYS</text>
      <text x="275" y="277" text-anchor="middle" class="value" fill="#f0f6fc">0</text><text x="435" y="277" text-anchor="middle" class="value" fill="#f0f6fc">0</text><text x="595" y="277" text-anchor="middle" class="value" fill="#f0f6fc">0</text><text x="760" y="277" text-anchor="middle" class="value" fill="#f0f6fc">0</text>
    </g>
  </g>

</svg>