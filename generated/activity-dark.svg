<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">GitHub activity for @demo-user</title>
  <desc id="desc">Demo profile card This is placeholder content used to demonstrate the profile activity card. Replace the values in config/profile.json with your own introduction and summary to personalize the card. 0 contributions this week, 0 this month, 0 this year, 2 total.</desc>
  <defs>
    <clipPath id="glass-clip">
      <rect x="16" y="122" width="868" height="210" rx="18"/>
    </clipPath>
    <linearGradient id="animated-border" x1="16" y1="122" x2="884" y2="332" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="25%" stop-color="#f7fbff"/>
      <stop offset="50%" stop-color="#ff7b72"/>
      <stop offset="75%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#58a6ff"/>
      <animateTransform
        attributeName="gradientTransform"
        type="rotate"
        from="0 450 227"
        to="360 450 227"
        dur="6s"
        repeatCount="indefinite"
      />
    </linearGradient>
    <linearGradient id="glass-fill" x1="0" y1="122" x2="0" y2="332" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#263140" stop-opacity="0.78"/>
      <stop offset="48%" stop-color="#111820" stop-opacity="0.66"/>
      <stop offset="100%" stop-color="#263140" stop-opacity="0.74"/>
    </linearGradient>
    <radialGradient id="ambient-blue" cx="0%" cy="0%" r="105%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.13"/>
      <stop offset="48%" stop-color="#58a6ff" stop-opacity="0.035"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient-red" cx="100%" cy="100%" r="110%">
      <stop offset="0%" stop-color="#ff7b72" stop-opacity="0.09"/>
      <stop offset="52%" stop-color="#ff7b72" stop-opacity="0.025"/>
      <stop offset="100%" stop-color="#ff7b72" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass-highlight" x1="40" y1="126" x2="804" y2="222" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="period-fill" x1="184" y1="182" x2="856" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.84"/>
      <stop offset="50%" stop-color="#161b22" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.76"/>
    </linearGradient>
    <filter id="panel-shadow" x="-12%" y="-32%" width="124%" height="174%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.15"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="activity-title-shadow" x="-8%" y="-45%" width="116%" height="190%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .introduction { font-size: 22px; font-weight: 600; }
    .about { font-weight: 400; }
    .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 1.4px; }
    .period { font-size: 10px; font-weight: 700; letter-spacing: 1.1px; }
    .row-label { font-size: 11px; font-weight: 700; letter-spacing: 1px; }
    .value { font-size: 29px; font-weight: 650; }
    .language { font-size: 12px; font-weight: 600; }
    .reveal {
      opacity: 0;
      animation: fade-in 950ms cubic-bezier(0.4, 0, 0.2, 1) both;
      will-change: opacity;
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; animation: none; }
    }
  </style>
  <rect width="900" height="440" fill="#0d1117"/>
  <text x="32" y="38" class="introduction reveal" style="animation-delay:0ms" fill="#f0f6fc">Demo profile card</text>
  <text x="32" y="65" class="about" fill="#8b949e"><tspan x="32" dy="0" class="reveal" style="animation-delay:90ms" font-size="14px" word-spacing="1px">This is placeholder content used to demonstrate the profile activity card. Replace the values in config/profile.json with your own</tspan><tspan x="32" dy="21" class="reveal" style="animation-delay:180ms" font-size="14px" word-spacing="0px">introduction and summary to personalize the card.</tspan></text>

  <g class="glass-panel">
    <g class="reveal" style="animation-delay:410ms">
      <rect x="16" y="122" width="868" height="210" rx="18" fill="#111820" opacity="0.74" filter="url(#panel-shadow)"/>
      <rect x="16" y="122" width="868" height="210" rx="18" fill="url(#glass-fill)"/>
      <g clip-path="url(#glass-clip)" pointer-events="none">
        <rect x="16" y="122" width="868" height="210" fill="url(#ambient-blue)"/>
        <rect x="16" y="122" width="868" height="210" fill="url(#ambient-red)"/>
      </g>
      <rect x="19" y="125" width="862" height="204" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
      <path d="M 40 123.5 H 764" stroke="url(#glass-highlight)" stroke-width="1.5" stroke-linecap="round"/>
      <rect x="17.25" y="123.25" width="865.5" height="207.5" rx="17" fill="none" stroke="url(#animated-border)" stroke-width="2.5"/>
    </g>
    <g class="reveal" style="animation-delay:540ms">
      <text x="44" y="155" class="eyebrow" fill="#ffffff" filter="url(#activity-title-shadow)">GITHUB ACTIVITY</text>
      <line x1="44" y1="170" x2="856" y2="170" stroke="#30363d" stroke-opacity="0.82"/>
    </g>
    <g class="reveal" style="animation-delay:630ms">
      <rect x="184" y="182" width="672" height="32" rx="6" fill="url(#period-fill)" stroke="#ffffff" stroke-opacity="0.09"/>
      <text x="275" y="202" text-anchor="middle" class="period" fill="#8b949e">THIS WEEK</text><text x="435" y="202" text-anchor="middle" class="period" fill="#8b949e">THIS MONTH</text><text x="595" y="202" text-anchor="middle" class="period" fill="#8b949e">THIS YEAR</text><text x="760" y="202" text-anchor="middle" class="period" fill="#8b949e">ALL TIME</text>
    </g>
    <g class="reveal" style="animation-delay:720ms">
      <text x="44" y="240" class="row-label" fill="#8b949e">CONTRIBUTIONS</text>
      <text x="275" y="245" text-anchor="middle" class="value" fill="#f0f6fc">0</text><text x="435" y="245" text-anchor="middle" class="value" fill="#f0f6fc">0</text><text x="595" y="245" text-anchor="middle" class="value" fill="#f0f6fc">0</text><text x="760" y="245" text-anchor="middle" class="value" fill="#f0f6fc">2</text>
    </g>
    <g class="reveal" style="animation-delay:810ms">
      <line x1="184" y1="260" x2="856" y2="260" stroke="#30363d" stroke-opacity="0.84"/>
      <text x="44" y="293" class="row-label" fill="#8b949e">ACTIVE DAYS</text>
      <text x="275" y="298" text-anchor="middle" class="value" fill="#f0f6fc">0</text><text x="435" y="298" text-anchor="middle" class="value" fill="#f0f6fc">0</text><text x="595" y="298" text-anchor="middle" class="value" fill="#f0f6fc">0</text><text x="760" y="298" text-anchor="middle" class="value" fill="#f0f6fc">1</text>
    </g>
  </g>

  <text x="32" y="369" class="eyebrow reveal" style="animation-delay:960ms" fill="#8b949e">FAVORITE LANGUAGES</text>
  <g class="reveal" style="animation-delay:1050ms">
    <g>
        <svg x="32" y="388" width="18" height="18" viewBox="0 0 24 24" role="img" aria-label="JavaScript logo">
          <title>JavaScript logo</title>
          <path d="M0 0h24v24H0V0zm22.034 18.276c-.175-1.095-.888-2.015-3.003-2.873-.736-.345-1.554-.585-1.797-1.14-.091-.33-.105-.51-.046-.705.15-.646.915-.84 1.515-.66.39.12.75.42.976.9 1.034-.676 1.034-.676 1.755-1.125-.27-.42-.404-.601-.586-.78-.63-.705-1.469-1.065-2.834-1.034l-.705.089c-.676.165-1.32.525-1.71 1.005-1.14 1.291-.811 3.541.569 4.471 1.365 1.02 3.361 1.244 3.616 2.205.24 1.17-.87 1.545-1.966 1.41-.811-.18-1.26-.586-1.755-1.336l-1.83 1.051c.21.48.45.689.81 1.109 1.74 1.756 6.09 1.666 6.871-1.004.029-.09.24-.705.074-1.65l.046.067zm-8.983-7.245h-2.248c0 1.938-.009 3.864-.009 5.805 0 1.232.063 2.363-.138 2.711-.33.689-1.18.601-1.566.48-.396-.196-.597-.466-.83-.855-.063-.105-.11-.196-.127-.196l-1.825 1.125c.305.63.75 1.172 1.324 1.517.855.51 2.004.675 3.207.405.783-.226 1.458-.691 1.811-1.411.51-.93.402-2.07.397-3.346.012-2.054 0-4.109 0-6.179l.004-.056z" fill="#F7DF1E"/>
        </svg>
        <text x="56" y="401" class="language" fill="#f0f6fc">JavaScript</text>
      </g>
  </g>
</svg>