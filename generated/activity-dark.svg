      <stop offset="48%" stop-color="#dce3eb" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="glass-glow" cx="18%" cy="0%" r="105%">
