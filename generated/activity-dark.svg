<svg xmlns="http://www.w3.org/2000/svg" width="900" height="344" viewBox="0 0 900 344" role="img" aria-labelledby="title desc">
  <title id="title">GitHub activity for @thibault-delattre</title>
  <desc id="desc">My name is Thibault Delattre As a software developer and AI Data Analyst, I am passionate about building intuitive applications where artificial intelligence solves practical problems. I currently design and engineer reliable web platforms that connect powerful AI models to user-friendly interfaces. Moving forward, my focus is to keep creating smart, scalable tools that turn ambitious ideas into engaging digital experiences. 94 contributions this week, 254 this month, 1164 this year, 4347 total.</desc>
  <defs>
    <clipPath id="glass-clip">
      <rect x="16" y="164" width="868" height="164" rx="18"/>
    </clipPath>
    <linearGradient id="glass-border" x1="16" y1="164" x2="884" y2="328" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="68%" stop-color="#dfe6ee" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="glass-fill" x1="0" y1="164" x2="0" y2="328" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="48%" stop-color="#dce3eb" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="glass-glow" cx="18%" cy="0%" r="105%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass-highlight" x1="40" y1="168" x2="804" y2="264" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.52"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="period-fill" x1="184" y1="180" x2="856" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.055"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.085"/>
    </linearGradient>
    <filter id="panel-shadow" x="-12%" y="-48%" width="124%" height="196%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.42"/>
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="liquid-texture" x="-8%" y="-28%" width="116%" height="156%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.035" numOctaves="2" seed="5" result="turbulence"/>
      <feGaussianBlur in="turbulence" stdDeviation="2.6" result="soft-map"/>
      <feSpecularLighting in="soft-map" surfaceScale="3" specularConstant="0.45" specularExponent="32" lighting-color="#ffffff" result="specular">
        <fePointLight x="-120" y="-180" z="260"/>
      </feSpecularLighting>
      <feComposite in="specular" in2="SourceGraphic" operator="in" result="clipped-specular"/>
      <feDisplacementMap in="SourceGraphic" in2="soft-map" scale="16" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
      <feBlend in="displaced" in2="clipped-specular" mode="screen"/>
    </filter>
    <filter id="soft-glow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .introduction { font-size: 22px; font-weight: 600; }
    .about { font-weight: 400; }
    .period { font-size: 10.5px; font-weight: 750; letter-spacing: 1.1px; }
    .row-label { font-size: 11px; font-weight: 750; letter-spacing: 1px; }
    .value { font-size: 29px; font-weight: 650; }
    .language { font-size: 12px; font-weight: 600; }
    .liquid-blob {
      transform-box: fill-box;
      transform-origin: center;
      animation: liquid-drift-one 15s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
      will-change: transform, opacity;
    }
    .liquid-blob.secondary {
      animation-name: liquid-drift-two;
      animation-duration: 19s;
    }
    .liquid-texture-layer {
      transform-box: fill-box;
      transform-origin: center;
      animation: liquid-texture-flow 24s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
      will-change: transform;
    }
    .reveal {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: smooth-appear 1050ms cubic-bezier(0.16, 1, 0.3, 1) both;
      will-change: opacity, transform;
    }
    @keyframes smooth-appear {
      0% { opacity: 0; transform: translateY(7px) scale(0.92); }
      68% { opacity: 1; transform: translateY(-1px) scale(1.018); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes liquid-drift-one {
      0% { transform: translate(-120px, -8px) scale(0.94); opacity: 0.08; }
      48% { transform: translate(170px, 18px) scale(1.08); opacity: 0.16; }
      100% { transform: translate(410px, -2px) scale(0.98); opacity: 0.1; }
    }
    @keyframes liquid-drift-two {
      0% { transform: translate(150px, 14px) scale(1.04); opacity: 0.07; }
      52% { transform: translate(-130px, -10px) scale(0.92); opacity: 0.13; }
      100% { transform: translate(-380px, 12px) scale(1.1); opacity: 0.08; }
    }
    @keyframes liquid-texture-flow {
      0% { transform: translate(-18px, -6px) scale(1.02); }
      50% { transform: translate(8px, 7px) scale(1.055); }
      100% { transform: translate(20px, -3px) scale(1.025); }
    }
    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; animation: none; }
      .liquid-blob, .liquid-texture-layer { animation: none; }
    }
  </style>
  <rect width="900" height="344" fill="#0d1117"/>
  <text x="32" y="38" class="introduction reveal" style="animation-delay:0ms" fill="#f7f9fc">My name is Thibault Delattre</text>
  <text x="32" y="65" class="about" fill="#d8e0ea"><tspan x="32" dy="0" class="reveal" style="animation-delay:90ms" font-size="14px" word-spacing="2px">As a software developer and AI Data Analyst, I am passionate about building intuitive applications where artificial intelligence</tspan><tspan x="32" dy="21" class="reveal" style="animation-delay:180ms" font-size="14px" word-spacing="0.6px">solves practical problems. I currently design and engineer reliable web platforms that connect powerful AI models to user-friendly</tspan><tspan x="32" dy="21" class="reveal" style="animation-delay:270ms" font-size="14px" word-spacing="2.3px">interfaces. Moving forward, my focus is to keep creating smart, scalable tools that turn ambitious ideas into engaging digital</tspan><tspan x="32" dy="21" class="reveal" style="animation-delay:360ms" font-size="14px" word-spacing="0px">experiences.</tspan></text>

  <g class="glass-panel">
    <g class="reveal" style="animation-delay:590ms">
      <rect x="16" y="164" width="868" height="164" rx="18" fill="#dce3eb" opacity="0.12" filter="url(#panel-shadow)"/>
      <rect x="16" y="164" width="868" height="164" rx="18" fill="url(#glass-fill)"/>
      <g clip-path="url(#glass-clip)" pointer-events="none">
        <rect x="16" y="164" width="868" height="164" fill="url(#glass-glow)"/>
        <ellipse class="liquid-blob" cx="176" cy="188" rx="300" ry="58" fill="#ffffff" filter="url(#soft-glow)"/>
        <ellipse class="liquid-blob secondary" cx="716" cy="296" rx="260" ry="64" fill="#ffffff" filter="url(#soft-glow)"/>
        <rect class="liquid-texture-layer" x="-4" y="144" width="908" height="204" rx="38" fill="#ffffff" fill-opacity="0.07" filter="url(#liquid-texture)"/>
      </g>
      <rect x="19" y="167" width="862" height="158" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.2"/>
      <path d="M 46 166 H 724" stroke="url(#glass-highlight)" stroke-width="2" stroke-linecap="round"/>
      <rect x="17.25" y="165.25" width="865.5" height="161.5" rx="17" fill="none" stroke="url(#glass-border)" stroke-width="2.5"/>
    </g>
    <g class="reveal" style="animation-delay:720ms">
      <rect x="184" y="180" width="672" height="32" rx="9" fill="url(#period-fill)" stroke="#ffffff" stroke-opacity="0.13"/>
      <text x="275" y="200" text-anchor="middle" class="period" fill="#d8e0ea">THIS WEEK</text><text x="435" y="200" text-anchor="middle" class="period" fill="#d8e0ea">THIS MONTH</text><text x="595" y="200" text-anchor="middle" class="period" fill="#d8e0ea">THIS YEAR</text><text x="760" y="200" text-anchor="middle" class="period" fill="#d8e0ea">ALL TIME</text>
    </g>
    <g class="reveal" style="animation-delay:810ms">
      <text x="44" y="242" class="row-label" fill="#d8e0ea">CONTRIBUTIONS</text>
      <text x="275" y="247" text-anchor="middle" class="value" fill="#f7f9fc">94</text><text x="435" y="247" text-anchor="middle" class="value" fill="#f7f9fc">254</text><text x="595" y="247" text-anchor="middle" class="value" fill="#f7f9fc">1,164</text><text x="760" y="247" text-anchor="middle" class="value" fill="#f7f9fc">4,347</text>
    </g>
    <g class="reveal" style="animation-delay:900ms">
      <line x1="184" y1="262" x2="856" y2="262" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="44" y="301" class="row-label" fill="#d8e0ea">ACTIVE DAYS</text>
      <text x="275" y="306" text-anchor="middle" class="value" fill="#f7f9fc">4</text><text x="435" y="306" text-anchor="middle" class="value" fill="#f7f9fc">15</text><text x="595" y="306" text-anchor="middle" class="value" fill="#f7f9fc">102</text><text x="760" y="306" text-anchor="middle" class="value" fill="#f7f9fc">361</text>
    </g>
  </g>

</svg>