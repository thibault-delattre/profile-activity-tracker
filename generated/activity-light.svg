      <text x="275" y="200" text-anchor="middle" class="period reveal" style="animation-delay:375ms" fill="#46515e">LAST 7 DAYS</text><text x="435" y="200" text-anchor="middle" class="period reveal" style="animation-delay:420ms" fill="#46515e">LAST 30 DAYS</text><text x="595" y="200" text-anchor="middle" class="period reveal" style="animation-delay:465ms" fill="#46515e">LAST 365 DAYS</text><text x="760" y="200" text-anchor="middle" class="period reveal" style="animation-delay:510ms" fill="#46515e">ALL TIME</text>
