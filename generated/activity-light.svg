      <text x="275" y="306" text-anchor="middle" class="value reveal" style="animation-delay:645ms" fill="#1f2328">5</text><text x="435" y="306" text-anchor="middle" class="value reveal" style="animation-delay:690ms" fill="#1f2328">12</text><text x="595" y="306" text-anchor="middle" class="value reveal" style="animation-delay:735ms" fill="#1f2328">178</text><text x="760" y="306" text-anchor="middle" class="value reveal" style="animation-delay:780ms" fill="#1f2328">385</text>
