<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" role="img" aria-labelledby="title desc">
  <title id="title">Combined GitHub activity for @thibault-delattre</title>
  <desc id="desc">My name is Thibault Delattre I&apos;m a full-stack engineer moving toward applied AI, currently finishing my MSc at EFREI Paris and preparing to apply to a graduate engineering program in South Korea.

At AXA, I work on Secure GPT, the company&apos;s internal LLM. Before that I built automated test infrastructure at JCDecaux for digital billboard systems running in 70+ countries, and shipped web features at Dassault Systèmes. I also spent three months as a research intern at NIT Akita College in Japan, training a computer-vision model to detect manufacturing defects on film capacitors. It was my first experience working in a lab environment.

On the side I build Reawon, an independent product ecosystem: Reafile, a browser-based AI file editor, and Polywon, an AI-powered language learning app. Combined across 2 GitHub accounts. 31 contributions this week, 191 this month, 1116 this year, 4309 total.</desc>
