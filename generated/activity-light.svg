  <rect width="900" height="590" fill="#ffffff"/>
  <text x="32" y="38" class="introduction reveal" style="animation-delay:0ms" fill="#1f2328">My name is Thibault Delattre</text>
  <text x="32" y="65" class="about" fill="#59636e"><tspan x="32" dy="0" class="reveal" style="animation-delay:110ms" font-size="14px" word-spacing="2.9px">I&apos;m a full-stack engineer moving toward applied AI, currently finishing my MSc at EFREI Paris and preparing to apply to a</tspan><tspan x="32" dy="21" class="reveal" style="animation-delay:220ms" font-size="14px" word-spacing="0px">graduate engineering program in South Korea.</tspan><tspan x="32" dy="33" class="reveal" style="animation-delay:330ms" font-size="14px" word-spacing="1.3px">At AXA, I work on Secure GPT, the company&apos;s internal LLM. Before that I built automated test infrastructure at JCDecaux for</tspan><tspan x="32" dy="21" class="reveal" style="animation-delay:440ms" font-size="14px" word-spacing="0.3px">digital billboard systems running in 70+ countries, and shipped web features at Dassault Systèmes. I also spent three months as a</tspan><tspan x="32" dy="21" class="reveal" style="animation-delay:550ms" font-size="14px" word-spacing="4.3px">research intern at NIT Akita College in Japan, training a computer-vision model to detect manufacturing defects on film</tspan><tspan x="32" dy="21" class="reveal" style="animation-delay:660ms" font-size="14px" word-spacing="0px">capacitors. It was my first experience working in a lab environment.</tspan><tspan x="32" dy="33" class="reveal" style="animation-delay:770ms" font-size="14px" word-spacing="3.7px">On the side I build Reawon, an independent product ecosystem: Reafile, a browser-based AI file editor, and Polywon, an</tspan><tspan x="32" dy="21" class="reveal" style="animation-delay:880ms" font-size="14px" word-spacing="0px">AI-powered language learning app.</tspan></text>

