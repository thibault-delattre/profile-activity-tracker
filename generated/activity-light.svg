<svg xmlns="http://www.w3.org/2000/svg" width="900" height="413" viewBox="0 0 900 413" role="img" aria-labelledby="title desc">
  <title id="title">Combined GitHub activity for @thibault-delattre</title>
  <desc id="desc">My name is Thibault Delattre. I&apos;m a second-year master&apos;s student at Efrei University in Paris. Combined across 2 GitHub accounts. 24 contributions this week, 184 this month, 1109 this year, 4303 total.</desc>
  <defs>
    <clipPath id="glass-clip">
      <rect x="16" y="72" width="868" height="210" rx="18"/>
    </clipPath>
    <linearGradient id="animated-border" x1="16" y1="72" x2="884" y2="282" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="25%" stop-color="#f7fbff"/>
      <stop offset="50%" stop-color="#ff7b72"/>
      <stop offset="75%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#58a6ff"/>
      <animateTransform
        attributeName="gradientTransform"
        type="rotate"
        from="0 450 177"
        to="360 450 177"
        dur="6s"
        repeatCount="indefinite"
      />
    </linearGradient>
    <linearGradient id="glass-fill" x1="16" y1="72" x2="884" y2="282" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="48%" stop-color="#eef3f8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.68"/>
    </linearGradient>
    <linearGradient id="glass-highlight" x1="40" y1="76" x2="804" y2="172" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="liquid-sheen" x1="-220" y1="72" x2="-20" y2="282" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="54%" stop-color="#dbeafe" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-220;920;-220" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-20;1120;-20" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="period-fill" x1="184" y1="132" x2="856" y2="164" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f6f8fa" stop-opacity="0.84"/>
      <stop offset="50%" stop-color="#f6f8fa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f6f8fa" stop-opacity="0.76"/>
    </linearGradient>
    <filter id="panel-shadow" x="-12%" y="-32%" width="124%" height="174%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#57606a" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#ffffff" flood-opacity="0.2"/>
    </filter>
    <filter id="liquid-blur" x="-20%" y="-80%" width="140%" height="260%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.025" numOctaves="2" seed="11" result="liquid-noise"/>
      <feDisplacementMap in="SourceGraphic" in2="liquid-noise" scale="16" xChannelSelector="R" yChannelSelector="B" result="refracted"/>
      <feGaussianBlur in="refracted" stdDeviation="26"/>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .introduction { font-size: 15px; font-weight: 500; }
    .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 1.4px; }
    .period { font-size: 10px; font-weight: 700; letter-spacing: 1.1px; }
    .row-label { font-size: 11px; font-weight: 700; letter-spacing: 1px; }
    .value { font-size: 29px; font-weight: 650; }
    .language { font-size: 12px; font-weight: 600; }
    .glass-panel {
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 360ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    svg:hover .glass-panel { transform: translateY(-3px) scale(1.004); }
    @media (prefers-reduced-motion: reduce) {
      .glass-panel { transition: none; }
    }
  </style>
