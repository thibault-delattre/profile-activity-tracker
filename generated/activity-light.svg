  <text x="450" y="38" text-anchor="middle" textLength="836" lengthAdjust="spacing" class="introduction" fill="#1f2328">My name is Thibault Delattre. I&apos;m a second year master&apos;s student at Efrei University in Paris.</text>
  <text x="32" y="64" class="about" fill="#59636e"><tspan x="32" dy="0" textLength="836" lengthAdjust="spacing">I enjoy building thoughtful software at the intersection of full stack engineering and AI. At AXA, I contribute to Secure</tspan><tspan x="32" dy="18" textLength="836" lengthAdjust="spacing">GPT, the company&apos;s internal LLM, while independently developing Reawon, an ecosystem that currently includes Reafile and</tspan><tspan x="32" dy="18" textLength="836" lengthAdjust="spacing">Polywon. My goal is to keep expanding these products and my AI expertise, and eventually continue my career in Asia.</tspan></text>

