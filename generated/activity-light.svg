<svg xmlns="http://www.w3.org/2000/svg" width="900" height="471" viewBox="0 0 900 471" role="img" aria-labelledby="title desc">
  <title id="title">Combined GitHub activity for @thibault-delattre</title>
  <desc id="desc">My name is Thibault Delattre. I&apos;m a second year master&apos;s student at Efrei University in Paris. I enjoy building thoughtful software at the intersection of full stack engineering and AI. At AXA, I contribute to Secure GPT, the company&apos;s internal LLM, while independently developing Reawon, an ecosystem that currently includes Reafile and Polywon. My goal is to keep expanding these products and my AI expertise, and eventually continue my career in Asia. Combined across 2 GitHub accounts. 29 contributions this week, 189 this month, 1114 this year, 4308 total.</desc>
