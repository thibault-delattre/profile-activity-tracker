<svg xmlns="http://www.w3.org/2000/svg" width="900" height="344" viewBox="0 0 900 344" role="img" aria-labelledby="title desc">
  <title id="title">GitHub activity for @thibault-delattre</title>
  <desc id="desc">My name is Thibault Delattre As a software developer and AI Data Analyst, I am passionate about building intuitive applications where artificial intelligence solves practical problems. I currently design and engineer reliable web platforms that connect powerful AI models to user-friendly interfaces. Moving forward, my focus is to keep creating smart, scalable tools that turn ambitious ideas into engaging digital experiences. 199 contributions in the last 7 days, 417 in the last 30 days, 2948 in the last 365 days, 5255 total. Every period is a rolling window of whole UTC days ending today, so each column contains the one before it. UTC date ranges: week: 2026-08-31 to 2026-09-06, month: 2026-08-08 to 2026-09-06, year: 2025-09-07 to 2026-09-06.</desc>
  <defs>
    <clipPath id="glass-clip">
      <rect x="16" y="164" width="868" height="164" rx="18"/>
    </clipPath>
    <linearGradient id="glass-border" x1="16" y1="164" x2="884" y2="328" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="68%" stop-color="#dfe6ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="glass-fill" x1="0" y1="164" x2="0" y2="328" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.94"/>
      <stop offset="48%" stop-color="#e8edf3" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.88"/>
    </linearGradient>
    <radialGradient id="glass-glow" cx="18%" cy="0%" r="105%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass-highlight" x1="40" y1="168" x2="804" y2="264" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="period-fill" x1="184" y1="180" x2="856" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.72"/>
    </linearGradient>
    <filter id="panel-shadow" x="-12%" y="-48%" width="124%" height="196%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#687482" flood-opacity="0.16"/>
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#687482" flood-opacity="0.09"/>
    </filter>
    <filter id="liquid-texture" x="-8%" y="-28%" width="116%" height="156%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.035" numOctaves="2" seed="5" result="turbulence"/>
      <feGaussianBlur in="turbulence" stdDeviation="2.6" result="soft-map"/>
      <feSpecularLighting in="soft-map" surfaceScale="3" specularConstant="0.45" specularExponent="32" lighting-color="#ffffff" result="specular">
        <fePointLight x="-120" y="-180" z="260"/>
      </feSpecularLighting>
      <feComposite in="specular" in2="SourceGraphic" operator="in" result="clipped-specular"/>
      <feDisplacementMap in="SourceGraphic" in2="soft-map" scale="16" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
      <feBlend in="displaced" in2="clipped-specular" mode="screen"/>
    </filter>
    <filter id="soft-glow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .introduction { font-size: 22px; font-weight: 600; }
    .about { font-weight: 400; }
    .period { font-size: 10.5px; font-weight: 750; letter-spacing: 1.1px; }
    .row-label { font-size: 11px; font-weight: 750; letter-spacing: 1px; }
    .value { font-size: 29px; font-weight: 650; }
    .language { font-size: 12px; font-weight: 600; }
    .liquid-blob {
      transform-box: fill-box;
      transform-origin: center;
      animation: liquid-drift-one 15s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
      will-change: transform, opacity;
    }
    .liquid-blob.secondary {
      animation-name: liquid-drift-two;
      animation-duration: 19s;
    }
    .liquid-texture-layer {
      transform-box: fill-box;
      transform-origin: center;
      animation: liquid-texture-flow 24s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
      will-change: transform;
    }
    .reveal {
      opacity: 1;
      animation: smooth-appear 720ms cubic-bezier(0.22, 1, 0.36, 1) both;
      will-change: opacity, transform;
    }
    @keyframes smooth-appear {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes liquid-drift-one {
      0% { transform: translate(-120px, -8px) scale(0.94); opacity: 0.18; }
      48% { transform: translate(170px, 18px) scale(1.08); opacity: 0.34; }
      100% { transform: translate(410px, -2px) scale(0.98); opacity: 0.22; }
    }
    @keyframes liquid-drift-two {
      0% { transform: translate(150px, 14px) scale(1.04); opacity: 0.14; }
      52% { transform: translate(-130px, -10px) scale(0.92); opacity: 0.28; }
      100% { transform: translate(-380px, 12px) scale(1.1); opacity: 0.16; }
    }
    @keyframes liquid-texture-flow {
      0% { transform: translate(-18px, -6px) scale(1.02); }
      50% { transform: translate(8px, 7px) scale(1.055); }
      100% { transform: translate(20px, -3px) scale(1.025); }
    }
    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; animation: none; }
      .liquid-blob, .liquid-texture-layer { animation: none; }
    }
  </style>
  <rect width="900" height="344" fill="#ffffff"/>
  <text x="32" y="38" class="introduction reveal" style="animation-delay:0ms" fill="#1f2328">My name is Thibault Delattre</text>
  <text x="32" y="65" class="about" fill="#46515e"><tspan x="32" dy="0" class="reveal" style="animation-delay:55ms" font-size="14px" word-spacing="2px">As a software developer and AI Data Analyst, I am passionate about building intuitive applications where artificial intelligence</tspan><tspan x="32" dy="21" class="reveal" style="animation-delay:110ms" font-size="14px" word-spacing="0.6px">solves practical problems. I currently design and engineer reliable web platforms that connect powerful AI models to user-friendly</tspan><tspan x="32" dy="21" class="reveal" style="animation-delay:165ms" font-size="14px" word-spacing="2.3px">interfaces. Moving forward, my focus is to keep creating smart, scalable tools that turn ambitious ideas into engaging digital</tspan><tspan x="32" dy="21" class="reveal" style="animation-delay:220ms" font-size="14px" word-spacing="0px">experiences.</tspan></text>

