name: Update profile activity

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "config/**"
      - "test/**"
      - "package.json"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-activity-update
  cancel-in-progress: true

jobs:
  generate:
    name: Generate activity cards
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Verify generator
        run: npm run check

      - name: Generate live cards
        run: npm run generate
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit changed cards
        run: |
          git add generated
          if git diff --cached --quiet; then
            echo "Cards are already current."
            exit 0
          fi
          git pull --rebase --autostash origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update profile activity"
          git push
