name: Update profile activity

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "config/**"
      - "test/**"
      - "package.json"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-activity-update
  cancel-in-progress: true

jobs:
  generate:
    name: Generate activity cards
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify generator
        run: npm run check

      - name: Generate live cards
        run: npm run generate
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit changed cards
        run: |
          git add generated
          if git diff --cached --quiet; then
            echo "Cards are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update profile activity"
          git push
